<!DOCTYPE html>

<html lang="es" xmlns:th="http://www.thymeleaf.org">

<head th:replace="~{layouts/main :: head}">
</head>

<body class="font-inter antialiased
             bg-gray-100 dark:bg-gray-900
             text-gray-600 dark:text-gray-400">

    <!-- Controlador condicional JS de la expansion del sidebar -->


    <div class="flex h-[100dvh] overflow-hidden">


        <!-- SIDEBAR -->
        <th:block th:replace="~{fragments/sidebar :: sidebar}">
        </th:block>


        <div class="relative flex flex-col flex-1
                overflow-y-auto overflow-x-hidden">


            <!-- HEADER -->
            <th:block th:replace="~{fragments/header :: header}">
            </th:block>


            <main class="grow">

                <div class="px-4 sm:px-6 lg:px-8
                        py-8
                        w-full
                        max-w-4xl
                        mx-auto">


                    <!-- TÍTULO -->

                    <div class="mb-6">

                        <h1 class="text-2xl
                               font-bold
                               text-gray-800
                               dark:text-gray-100">

                            Nuevo usuario

                        </h1>

                        <p class="text-sm text-gray-500 mt-1">

                            Registra un nuevo usuario con acceso a ScannerCP.

                        </p>

                    </div>


                    <!-- FORMULARIO -->

                    <div class="bg-white
                            dark:bg-gray-800
                            shadow-xs
                            rounded-xl
                            p-8
                            md:p-10">


                        <form action="@{/usuarios}" th:object="${usuarioForm}" method="post">


                            <!-- ERROR GENERAL -->

                            <div th:if="${#fields.hasGlobalErrors()}" class="mb-5
                                    p-4
                                    rounded-lg
                                    bg-red-50
                                    text-red-700">

                                <p th:each="error : ${#fields.globalErrors()}" th:text="${error}">
                                </p>

                            </div>


                            <div class="grid
                                    grid-cols-1
                                    md:grid-cols-2
                                    gap-6">


                                <!-- CÓDIGO -->

                                <div>

                                    <label class="block
                                              text-sm
                                              font-medium
                                              mb-2">

                                        Código

                                    </label>

                                    <input type="text" th:field="*{codigo}" class="w-full
                                              rounded-lg
                                              border
                                              border-gray-300
                                              dark:border-gray-700
                                              dark:bg-gray-900
                                              px-4 py-3">

                                    <p th:if="${#fields.hasErrors('codigo')}" th:errors="*{codigo}"
                                        class="text-red-500 text-xs mt-1">
                                    </p>

                                </div>


                                <!-- ROL -->

                                <div>

                                    <label class="block
                                              text-sm
                                              font-medium
                                              mb-2">

                                        Rol

                                    </label>

                                    <select th:field="*{rol}" class="w-full
                                               rounded-lg
                                               border
                                               border-gray-300
                                               dark:border-gray-700
                                               dark:bg-gray-900
                                               px-4 py-3">

                                        <option value="">
                                            Selecciona un rol
                                        </option>

                                        <option th:each="rol : ${roles}" th:value="${rol}" th:text="${rol}">
                                        </option>

                                    </select>

                                    <p th:if="${#fields.hasErrors('rol')}" th:errors="*{rol}"
                                        class="text-red-500 text-xs mt-1">
                                    </p>

                                </div>


                                <!-- NOMBRES -->

                                <div>

                                    <label class="block
                                              text-sm
                                              font-medium
                                              mb-2">

                                        Nombres

                                    </label>

                                    <input type="text" th:field="*{nombres}" class="w-full
                                              rounded-lg
                                              border
                                              border-gray-300
                                              dark:border-gray-700
                                              dark:bg-gray-900
                                              px-4 py-3">

                                    <p th:if="${#fields.hasErrors('nombres')}" th:errors="*{nombres}"
                                        class="text-red-500 text-xs mt-1">
                                    </p>

                                </div>


                                <!-- APELLIDOS -->

                                <div>

                                    <label class="block
                                              text-sm
                                              font-medium
                                              mb-2">

                                        Apellidos

                                    </label>

                                    <input type="text" th:field="*{apellidos}" class="w-full
                                              rounded-lg
                                              border
                                              border-gray-300
                                              dark:border-gray-700
                                              dark:bg-gray-900
                                              px-4 py-3">

                                    <p th:if="${#fields.hasErrors('apellidos')}" th:errors="*{apellidos}"
                                        class="text-red-500 text-xs mt-1">
                                    </p>

                                </div>


                                <!-- CORREO -->

                                <div>

                                    <label class="block
                                              text-sm
                                              font-medium
                                              mb-2">

                                        Correo

                                    </label>

                                    <input type="email" th:field="*{correo}" class="w-full
                                              rounded-lg
                                              border
                                              border-gray-300
                                              dark:border-gray-700
                                              dark:bg-gray-900
                                              px-4 py-3">

                                    <p th:if="${#fields.hasErrors('correo')}" th:errors="*{correo}"
                                        class="text-red-500 text-xs mt-1">
                                    </p>

                                </div>


                                <!-- PASSWORD -->

                                <div>

                                    <label class="block
                                              text-sm
                                              font-medium
                                              mb-2">

                                        Contraseña

                                    </label>

                                    <input type="password" th:field="*{password}" class="w-full
                                              rounded-lg
                                              border
                                              border-gray-300
                                              dark:border-gray-700
                                              dark:bg-gray-900
                                              px-4 py-3">

                                    <p th:if="${#fields.hasErrors('password')}" th:errors="*{password}"
                                        class="text-red-500 text-xs mt-1">
                                    </p>

                                </div>

                            </div>


                            <!-- BOTONES -->

                            <div class="flex
                                    justify-end
                                    gap-3
                                    mt-8">

                                <a th:href="@{/usuarios}" class="px-4 py-2
                                      rounded-lg
                                      border
                                      border-gray-300
                                      dark:border-gray-700">

                                    Cancelar

                                </a>


                                <button type="submit" class="px-4 py-2
                                           rounded-lg
                                           bg-violet-600
                                           text-white
                                           font-medium">

                                    Guardar usuario

                                </button>

                            </div>

                        </form>

                    </div>

                </div>

            </main>

        </div>

    </div>

    <th:block th:replace="~{layouts/main :: scripts}">
    </th:block>

</body>

</html>
