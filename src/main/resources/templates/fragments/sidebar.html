<th:block xmlns:th="http://www.thymeleaf.org" th:fragment="sidebar">

    <div class="min-w-fit">

        <!-- Fondo oscuro cuando sidebar está abierto en móvil -->
        <div id="sidebar-backdrop" class="fixed inset-0 bg-gray-900/30 z-40
                   lg:hidden lg:z-auto
                   opacity-0 pointer-events-none
                   transition-opacity duration-200" aria-hidden="true">
        </div>

        <!-- SIDEBAR -->
        <div id="sidebar" class="flex flex-col
           absolute z-40 left-0 top-0
           lg:static
           lg:left-auto
           lg:top-auto
           lg:translate-x-0
           h-[100dvh]
           overflow-y-scroll
           lg:overflow-y-auto
           no-scrollbar

           w-64
           lg:w-20

           shrink-0
           bg-white
           dark:bg-gray-800
           p-4
           transition-all
           duration-200
           ease-in-out
           -translate-x-64
           rounded-r-2xl
           shadow-xs">


            <!-- HEADER DEL SIDEBAR -->
            <div class="flex justify-between mb-10 pr-3 sm:px-2">

                <!-- Botón cerrar en móvil -->
                <button id="sidebar-close" type="button" class="lg:hidden text-gray-500 hover:text-gray-400"
                    aria-controls="sidebar">

                    <span class="sr-only">
                        Cerrar sidebar
                    </span>

                    <svg class="w-6 h-6 fill-current" viewBox="0 0 24 24">

                        <path d="M10.7 18.7l1.4-1.4L7.8 13H20v-2H7.8l4.3-4.3-1.4-1.4L4 12z">
                        </path>

                    </svg>

                </button>


                <!-- LOGO -->
                <a th:href="@{/}" class="block">

                    <svg class="fill-violet-500" xmlns="http://www.w3.org/2000/svg" width="32" height="32">

                        <path d="M31.956 14.8C31.372 6.92 25.08.628
                               17.2.044V5.76a9.04 9.04 0 0 0
                               9.04 9.04h5.716ZM14.8 26.24v5.716C6.92
                               31.372.63 25.08.044 17.2H5.76a9.04
                               9.04 0 0 1 9.04 9.04Zm11.44-9.04h5.716c-.584
                               7.88-6.876 14.172-14.756
                               14.756V26.24a9.04 9.04 0 0 1
                               9.04-9.04ZM.044 14.8C.63 6.92
                               6.92.628 14.8.044V5.76a9.04
                               9.04 0 0 1-9.04 9.04H.044Z">
                        </path>

                    </svg>

                </a>

            </div>

            <!-- EXPANDIR / CONTRAER SIDEBAR -->
            <div class="hidden lg:flex justify-end mb-4">

                <button id="sidebar-expand" type="button" class="flex items-center justify-center
               w-8 h-8
               rounded-lg
               text-gray-500
               hover:text-gray-700
               hover:bg-gray-100
               dark:text-gray-400
               dark:hover:text-gray-200
               dark:hover:bg-gray-700
               transition" aria-label="Expandir menú">

                    <svg id="sidebar-expand-icon" class="w-5 h-5
                   fill-current
                   transition-transform
                   duration-200" viewBox="0 0 24 24">

                        <path d="M9 18l6-6-6-6
                   1.4-1.4L17.8 12
                   l-7.4 7.4L9 18z">
                        </path>

                    </svg>

                </button>

            </div>


            <!-- ENLACES -->
            <div class="space-y-8">

                <div>
                    <ul class="mt-3">

                        <!-- DASHBOARD -->
                        <li class="mb-1">

                            <a th:href="@{/}" class="flex items-center
               px-3 py-2
               rounded-lg
               text-gray-800
               dark:text-gray-100
               hover:bg-gray-100
               dark:hover:bg-gray-700/50
               transition">

                                <svg class="shrink-0
                   fill-current
                   text-violet-500" width="16" height="16" viewBox="0 0 16 16">

                                    <path d="M5.936.278A7.983 7.983 0 0 1 8 0
                   a8 8 0 1 1-8 8c0-.722.104-1.413.278-2.064
                   a1 1 0 1 1 1.932.516A5.99 5.99 0 0 0 2 8
                   a6 6 0 1 0 6-6c-.53 0-1.045.076-1.548.21
                   A1 1 0 1 1 5.936.278Z">
                                    </path>

                                </svg>

                                <span class="sidebar-text
                   text-sm
                   font-medium
                   ml-4
                   lg:hidden">

                                    Dashboard

                                </span>

                            </a>

                        </li>
                        <!-- INVENTARIO -->
                        <li class="mb-1">

                            <button id="inventory-toggle" type="button" class="w-full
               flex items-center
               justify-between
               px-3 py-2
               rounded-lg
               text-gray-700
               dark:text-gray-200
               hover:bg-gray-100
               dark:hover:bg-gray-700/50
               transition">

                                <div class="flex items-center">

                                    <!-- ICONO -->
                                    <svg class="shrink-0
                       fill-current
                       text-gray-400" width="16" height="16" viewBox="0 0 16 16">

                                        <path d="M1 2a1 1 0 0 1 1-1h12
                       a1 1 0 0 1 1 1v4
                       a1 1 0 0 1-1 1H2
                       a1 1 0 0 1-1-1V2Zm2 1v2h10V3H3Zm-2
                       7a1 1 0 0 1 1-1h12
                       a1 1 0 0 1 1 1v4
                       a1 1 0 0 1-1 1H2
                       a1 1 0 0 1-1-1v-4Zm2 1v2h10v-2H3Z">
                                        </path>

                                    </svg>

                                    <span class="sidebar-text
                       text-sm
                       font-medium
                       ml-4
                       lg:hidden">

                                        Inventario

                                    </span>

                                </div>


                                <!-- FLECHA -->
                                <svg id="inventory-arrow" class="sidebar-text
                   lg:hidden
                   w-3 h-3
                   fill-current
                   text-gray-400
                   transition-transform" viewBox="0 0 12 12">

                                    <path d="M5.9 11.4.5 6l1.4-1.4
                   4 4 4-4L11.3 6z">
                                    </path>

                                </svg>

                            </button>


                            <!-- SUBMENU -->
                            <div id="inventory-menu" class="sidebar-submenu hidden">

                                <ul class="pl-12 mt-1">

                                    <li class="mb-1">

                                        <a th:href="@{/maquinas}" class="block
                           py-1
                           text-sm
                           text-gray-500
                           dark:text-gray-400
                           hover:text-violet-500">

                                            Máquinas

                                        </a>

                                    </li>


                                    <li class="mb-1">

                                        <a th:href="@{/piezas}" class="block
                           py-1
                           text-sm
                           text-gray-500
                           dark:text-gray-400
                           hover:text-violet-500">

                                            Piezas

                                        </a>

                                    </li>

                                </ul>

                            </div>

                        </li>
                        <!-- MANTENIMIENTOS -->
                        <li class="mb-1">

                            <a th:href="@{/mantenimientos}" class="flex items-center
               px-3 py-2
               rounded-lg
               text-gray-700
               dark:text-gray-200
               hover:bg-gray-100
               dark:hover:bg-gray-700/50
               transition">

                                <svg class="shrink-0
                   fill-current
                   text-gray-400" width="16" height="16" viewBox="0 0 16 16">

                                    <path d="M14.7 2.3a4 4 0 0 1-5.1 5.1
                   l-5.9 5.9a1.5 1.5 0 0 1-2.1-2.1
                   l5.9-5.9a4 4 0 0 1 5.1-5.1
                   l-2.3 2.3.7 2.1 2.1.7 2.3-2.3
                   a4 4 0 0 1-.7-.7Z">
                                    </path>

                                </svg>

                                <span class="sidebar-text
                   text-sm
                   font-medium
                   ml-4
                   lg:hidden">

                                    Mantenimientos

                                </span>

                            </a>

                        </li>
                        <!-- RONDAS -->
                        <!-- <li class="mb-1">

                            <a th:href="@{/rondas}" class="flex items-center
               px-3 py-2
               rounded-lg
               text-gray-700
               dark:text-gray-200
               hover:bg-gray-100
               dark:hover:bg-gray-700/50
               transition">

                                <svg class="shrink-0
                   fill-current
                   text-gray-400" width="16" height="16" viewBox="0 0 16 16">

                                    <path d="M8 1a7 7 0 1 0 7 7
                   1 1 0 1 0-2 0
                   5 5 0 1 1-1.46-3.54
                   L8 8h5V3l-1.46 1.46
                   A6.96 6.96 0 0 0 8 1Z">
                                    </path>

                                </svg>

                                <span class="sidebar-text
                   text-sm
                   font-medium
                   ml-4
                   lg:hidden">

                                    Rondas

                                </span>

                            </a>

                        </li> -->
                        <!-- INSPECCIONES -->
                        <li class="mb-1">

                            <a th:href="@{/inspecciones}" class="flex items-center
               px-3 py-2
               rounded-lg
               text-gray-700
               dark:text-gray-200
               hover:bg-gray-100
               dark:hover:bg-gray-700/50
               transition">

                                <svg class="shrink-0
                   fill-current
                   text-gray-400" width="16" height="16" viewBox="0 0 16 16">

                                    <path d="M5 1h6v2h3v12H2V3h3V1Zm2 2h2V2H7v1Zm-3
                   2v8h8V5H4Zm2 2h4v1H6V7Zm0 3h4v1H6v-1Z">
                                    </path>

                                </svg>

                                <span class="sidebar-text
                   text-sm
                   font-medium
                   ml-4
                   lg:hidden">

                                    Inspecciones

                                </span>

                            </a>

                        </li>
                        <!-- REPORTES -->
                        <li class="mb-1">

                            <a th:href="@{/reportes}" class="flex items-center
               px-3 py-2
               rounded-lg
               text-gray-700
               dark:text-gray-200
               hover:bg-gray-100
               dark:hover:bg-gray-700/50
               transition">

                                <span class="text-gray-400">
                                    ▤
                                </span>

                                <span class="sidebar-text
                   text-sm
                   font-medium
                   ml-4
                   lg:hidden">

                                    Reportes

                                </span>

                            </a>

                        </li>


                        <!-- USUARIOS -->
                        <li class="mb-1">

                            <a th:href="@{/usuarios}" class="flex items-center
               px-3 py-2
               rounded-lg
               text-gray-700
               dark:text-gray-200
               hover:bg-gray-100
               dark:hover:bg-gray-700/50
               transition">

                                <span class="text-gray-400">
                                    ◉
                                </span>

                                <span class="sidebar-text
                   text-sm
                   font-medium
                   ml-4
                   lg:hidden">

                                    Usuarios

                                </span>

                            </a>

                        </li>

                    </ul>

                </div>

            </div>

        </div>

    </div>

</th:block>
