<th:block xmlns:th="http://www.thymeleaf.org" th:fragment="userMenu">

    <div class="relative inline-flex">

        <!-- BOTÓN USUARIO -->
        <button id="user-menu-toggle" type="button" class="inline-flex justify-center items-center group"
            aria-haspopup="true" aria-expanded="false">

            <!-- Avatar temporal -->
            <div class="w-8 h-8
                       rounded-full
                       bg-violet-500
                       flex items-center
                       justify-center
                       text-white
                       font-semibold">

                J

            </div>


            <!-- Nombre -->
            <div class="flex items-center truncate">

                <span class="truncate ml-2
                           text-sm
                           font-medium
                           text-gray-800
                           dark:text-gray-100">

                    Jeins

                </span>

                <!-- Flecha -->
                <svg id="user-menu-arrow" class="w-3 h-3
                           shrink-0
                           ml-1
                           fill-current
                           text-gray-400
                           transition-transform
                           duration-200" viewBox="0 0 12 12">

                    <path d="M5.9 11.4.5 6l1.4-1.4
                           4 4 4-4L11.3 6z">
                    </path>

                </svg>

            </div>

        </button>


        <!-- DROPDOWN -->
        <div id="user-menu" class="hidden
                   origin-top-right
                   z-50
                   absolute
                   top-full
                   right-0
                   min-w-44
                   bg-white
                   dark:bg-gray-800
                   border
                   border-gray-200
                   dark:border-gray-700/60
                   py-1.5
                   rounded-lg
                   shadow-lg
                   overflow-hidden
                   mt-1">

            <!-- INFORMACIÓN -->
            <div class="pt-0.5
                       pb-2
                       px-3
                       mb-1
                       border-b
                       border-gray-200
                       dark:border-gray-700/60">

                <div class="font-medium
                           text-gray-800
                           dark:text-gray-100">

                    Jeins

                </div>

                <div class="text-xs
                           text-gray-500
                           dark:text-gray-400">

                    Administrador

                </div>

            </div>


            <!-- OPCIONES -->
            <ul>

                <li>

                    <a th:href="@{/perfil}" class="font-medium
                               text-sm
                               text-violet-500
                               hover:text-violet-600
                               dark:hover:text-violet-400
                               flex items-center
                               py-1
                               px-3">

                        Mi perfil

                    </a>

                </li>


                <li>

                    <a th:href="@{/configuracion}" class="font-medium
                               text-sm
                               text-violet-500
                               hover:text-violet-600
                               dark:hover:text-violet-400
                               flex items-center
                               py-1
                               px-3">

                        Configuración

                    </a>

                </li>


                <li>

                    <button type="button" class="font-medium
                               text-sm
                               text-violet-500
                               hover:text-violet-600
                               dark:hover:text-violet-400
                               flex items-center
                               w-full
                               py-1
                               px-3">

                        Cerrar sesión

                    </button>

                </li>

            </ul>

        </div>

    </div>

</th:block>
